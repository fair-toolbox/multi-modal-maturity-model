# File pattern definitions for repository metrics extraction

pattern_groups:

  # Workflow management system file patterns
  workflow_files:
    - "*.cwl"
    - "main.nf"
    - "nextflow.config"
    - "*.nf"
    - "Snakefile"
    - "*.smk"
    - "*.wdl"

  # Distribution and packaging file patterns
  distribution_files:
    # containers
    - "Dockerfile"
    - "Containerfile"
    - "apptainer.def"
    - "Singularity"
    - "*.dockerfile"
    # python_package:
    - "pyproject.toml"
    - "setup.py"
    - "requirements.txt"
    # conda:
    - "environment.yml"
    - "environment.yaml"
    - "conda/meta.yaml"
    - "meta.yaml"

  # Security policy file patterns
  security_policy_files:
    - "**/SECURITY.md"
    - "**/SECURITY.rst"
    - "**/SECURITY.txt"

  # Security scanning configuration file patterns
  security_scanning_files:
    # github:
    - ".github/dependabot.yml"
    - ".github/dependabot.yaml"
    - ".github/workflows/*codeql*.yml"
    - ".github/workflows/*codeql*.yaml"
    - ".github/workflows/*security*.yml"
    - ".github/workflows/*security*.yaml"
    - ".github/workflows/*scorecards*.yml"
    - ".github/workflows/*scorecards*.yaml"
    # gitlab:
    - "*sast*.gitlab-ci.yml"
    - "*dependency-scanning*.gitlab-ci.yml"
    - "*secret-detection*.gitlab-ci.yml"
    - "*container-scanning*.gitlab-ci.yml"
    - ".gitlab/*sast*.yml"
    - ".gitlab/*dependency-scanning*.yml"
    - ".gitlab/*secret-detection*.yml"
    - "ci/*sast*.yml"
    - "ci/*dependency-scanning*.yml"
    - "ci/*secret-detection*.yml"


  gitignore_file:
    - ".gitignore"
