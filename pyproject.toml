[project]
name = "multi-modal-maturity-model"
version = "0.1.0"
description = "Multi-modal maturity model for research software and services."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "howfairis (>=0.14.2,<0.15.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "pygithub (>=2.8.1,<3.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
