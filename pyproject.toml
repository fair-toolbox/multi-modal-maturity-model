[project]
name = "multi-modal-maturity-model"
version = "0.1.0"
description = "Multi-modal maturity model for research software and services."
authors = [
    {name = "Ana Mendes",email = "anitamnd@github.com"},
    {name = "Magnus Palmblad",email = "magnuspalmblad@github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "howfairis @ git+https://github.com/anitamnd/howfairis.git@feat/connection-pooling",
    "pandas (>=3.0.0,<4.0.0)",
    "pygithub (>=2.8.1,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "lizard (>=1.21.0,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "python-gitlab (>=8.0.0,<9.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
]

[project.scripts]
m4 = "multi_modal_maturity_model.cli:main"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
]
docs = [
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.1,<10.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
include = [
    { path = "src/multi_modal_maturity_model/data/*.json", format = ["sdist", "wheel"] }
]

[tool.poetry.scripts]
update_edam = "scripts.update_edam:main"
